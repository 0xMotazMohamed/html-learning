<!DOCTYPE html>
<!-- Tells the browser that this document uses HTML5 -->

<html lang="en-US">
<!-- The root element of the webpage.
     lang="en-US" tells browsers and accessibility tools
     that the page is written in US English. -->

    <head>
        <!-- Contains information about the webpage that is
             not directly displayed on the page -->

        <meta charset="UTF-8">
        <!-- Defines the character encoding.
             UTF-8 allows the page to display most characters correctly. -->

        <meta name="author" content="Moataz M. Ali">
        <!-- Specifies the author/creator of the webpage -->

        <meta
            name="description"
            content="This page contains all the things I am learning how to create as I learn HTML"
        >
        <!-- Provides a short description of what the webpage is about.
             Search engines may use this description in search results. -->

        <title>My First Web Page</title>
        <!-- The title displayed in the browser tab -->

        <link
            rel="icon"
            href="html5.png"
            type="image/x-icon"
        >
        <!-- Sets the HTML5 logo as the webpage favicon.
             href specifies the location of the icon. -->        
        
        <link rel="stylesheet" href="main.css" type="text/css">
        <!-- Links an external CSS file instead of writing CSS inside <style> -->
    </head>

    <body>
        <!-- Contains the visible content of the webpage -->

        <h1>Hello World</h1>
        <!-- Main heading of the webpage -->

        <p>This is my first web page.</p>
        <!-- A paragraph containing text -->

    </body>

</html>
<!-- End of the HTML document -->

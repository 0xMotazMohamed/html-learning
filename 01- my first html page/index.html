<!DOCTYPE html>
<html lang="en-US">

    <head>

        <meta charset="UTF-8">

        <meta name="author" content="Moataz M. Ali">
        <!-- Specifies the author/creator of the webpage -->

        <meta name="description" content="This page contains all the things I am learning how to create as I learn HTML">
        <!-- Provides a short description of what the webpage is about.
         Search engines may use this description in search results. -->

        <title>My First Web Page</title>

        <link rel="icon" href="HTML5_Logo.svg" type="image/svg+xml">
        <!-- Sets the HTML5 logo as the webpage favicon.
         href specifies the location of the icon.
         type tells the browser that the file is an SVG image. -->

    <style>
        html {
            font-size: 22px;
        }
        body {
            background-color: #333;
            color: whitesmoke;
        }
    </style>

    </head>

    <body>

        <h1>Hello World</h1>
        <p>This is my first web page.</p>

    </body>

</html>

<!DOCTYPE html>
<!-- Tells the browser that this document uses HTML5 -->

<html lang="en-US">
<!-- The root element of the page. 
 lang="en-US" tells browsers and accessibility 
 tools that the page is written in US English. -->

    <head> <!-- Contains information about the page that is not directly displayed -->
       
        <meta charset="UTF-8">
        <!-- Defines the character encoding. 
         UTF-8 allows the page to display most
          characters and symbols correctly. -->
            
          <title>My First Web Page</title> <!-- The title shown in the browser tab -->
    <style>
    /* CSS rules used to style the HTML page */
        html {
            font-size: 22px;
        }
        body {
            background-color: #333;
            color: whitesmoke;
        }
    </style>

    </head>
    <body> <!-- Contains the content that is actually displayed on the page -->
        
        <h1>Hello World</h1>
        <p>This is my first web page.</p>
   
    </body>

</html> <!-- End of the HTML document -->
